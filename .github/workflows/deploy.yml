name: Pubblica AdM su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preleva il repository
        uses: actions/checkout@v6

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Impacchetta il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
